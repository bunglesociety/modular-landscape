<style>
/* Modular Compagnon, page bunglesociety.com: a Squarespace code block (HTML + CSS only, no script: the Basic plan).
   The page itself is painted in the screen's old paper (below); the rest is scoped under .mlw. FR / EN: two radio
   buttons, CSS only. tools/make_compagnon_site.py wraps this same block into the GitHub Pages home. */
@import url("https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap");
/* the whole page on the paper: this block is only on this page, so these rules touch only it
   (Squarespace 7.1: each section draws its colour in .section-background; the header and footer too) */
html, body, #siteWrapper, #page, main#page, .page-section, .page-section > .section-background, .section-background,
#footer-sections, #footer-sections .section-background, header#header, header#header .header-background-solid,
.header-announcement-bar-wrapper { background-color: #d8dcd6 !important; background-image: none !important; }
header#header a, header#header .header-nav-item a, header#header .header-title a, header#header .header-burger-btn,
#footer-sections, #footer-sections p, #footer-sections a { color: #27323a !important; }
header#header .burger-inner > div { background-color: #27323a !important; }
.mlw { --bg: #d8dcd6; --grain: #ccd1ca; --panel: #e7eae4; --dim: #5f6b70; --ink: #27323a; --green: #4f7385; --warm: #9c5a3c;
       --night: #232040; --shadow: rgba(39, 50, 58, .28);
       background-color: var(--bg); background-image: radial-gradient(var(--grain) 1px, transparent 1.2px); background-size: 7px 7px;
       color: var(--ink); font: 15px/1.65 "IBM Plex Mono", ui-monospace, Menlo, monospace;
       padding: 28px clamp(16px, 4vw, 44px) 40px; box-sizing: border-box; text-align: left; }
.mlw *, .mlw *::before, .mlw *::after { box-sizing: border-box; }
.mlw p, .mlw h1, .mlw h2, .mlw h3, .mlw ul { margin: 0; padding: 0; color: var(--ink); text-transform: none; letter-spacing: normal; }
.mlw a { color: var(--ink); }
.mlw .px { font-family: "Silkscreen", "IBM Plex Mono", monospace !important; letter-spacing: .04em; font-weight: 400 !important; }

/* the language switch: two radios, the words of the other language hidden */
.mlw input.mlw-l { position: absolute; opacity: 0; pointer-events: none; }
.mlw img.map { display: block; width: 100%; height: auto; margin: 8px 0 18px; border-radius: 6px; }
.mlw .lang { display: flex; justify-content: flex-end; gap: 4px; font-family: "Silkscreen", monospace; font-size: 12px; color: var(--dim); }
.mlw .lang label { cursor: pointer; padding: 2px 6px; color: var(--dim); }
.mlw #mlw-fr:checked ~ .lang label[for="mlw-fr"], .mlw #mlw-en:checked ~ .lang label[for="mlw-en"] { color: var(--ink); text-decoration: underline; }
.mlw #mlw-fr:checked ~ * .en, .mlw #mlw-en:checked ~ * .fr { display: none !important; }

.mlw .hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; align-items: center; padding: 26px 0 28px; }
@media (max-width: 820px) { .mlw .hero { grid-template-columns: 1fr; gap: 26px; } }
.mlw h1 { font-size: clamp(36px, 6.2vw, 62px) !important; line-height: .95 !important; margin: 0 0 18px; }
.mlw .lead { font-size: 17px; margin-bottom: 22px; max-width: 520px; }
.mlw .cta { display: flex; flex-wrap: wrap; gap: 14px; }
.mlw a.btn { font-family: "Silkscreen", monospace; font-size: 15px; letter-spacing: .04em; text-decoration: none; padding: 13px 20px;
             background: var(--ink); color: var(--bg); box-shadow: 4px 4px 0 var(--shadow); display: inline-block; }
.mlw a.btn:hover { filter: brightness(1.18); }
.mlw a.btn.ghost { background: transparent; color: var(--ink); outline: 3px solid var(--ink); outline-offset: -3px; box-shadow: none; }
.mlw .note { font-size: 12.5px; color: var(--dim); margin-top: 14px; }
.mlw .screen { background: #1d1b18; padding: 20px 20px 14px; border-radius: 10px; box-shadow: 8px 8px 0 var(--shadow); max-width: 440px; width: 100%; justify-self: center; }
.mlw .screen img { display: block; width: 100%; height: auto; aspect-ratio: 1; image-rendering: pixelated; border: 2px solid #000; }
.mlw .screen .lbl { color: #8c8678; font-family: "Silkscreen", monospace; font-size: 11px; letter-spacing: .08em; margin-top: 10px; display: flex; justify-content: space-between; gap: 10px; }

.mlw section { padding: 30px 0 4px; border-top: 3px solid var(--ink); margin-top: 24px; }
.mlw h2 { font-size: 22px !important; margin-bottom: 16px; }
.mlw .story { max-width: 720px; font-size: 16px; }
.mlw .story p + p { margin-top: 12px; }

.mlw .family { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; background: var(--panel); border: 3px solid var(--ink); padding: 14px 18px; font-size: 14px; }
.mlw .family b { font-family: "Silkscreen", monospace; font-weight: 400; letter-spacing: .04em; }
.mlw .family .grow { flex: 1; min-width: 220px; }
.mlw .family a { font-family: "Silkscreen", monospace; font-size: 13px; white-space: nowrap; }

.mlw .feats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
@media (max-width: 900px) { .mlw .feats { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .mlw .feats { grid-template-columns: 1fr; } }
.mlw .feat { background: var(--panel); border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--shadow); }
.mlw .feat img { display: block; width: 100%; height: auto; aspect-ratio: 1; image-rendering: pixelated; border-bottom: 3px solid var(--ink); }
.mlw .feat div { padding: 14px 16px 16px; }
.mlw .feat h3 { font-size: 15px !important; margin-bottom: 6px; }
.mlw .feat p { font-size: 13.5px; }

.mlw .ctl { display: grid; grid-template-columns: 12em 1fr; gap: 6px 18px; max-width: 760px; font-size: 14px; }
@media (max-width: 600px) { .mlw .ctl { grid-template-columns: 1fr; gap: 2px; } .mlw .ctl dd { margin-bottom: 8px !important; } }
.mlw .ctl dt { font-family: "Silkscreen", monospace; font-size: 13px; letter-spacing: .03em; }
.mlw .ctl dd { margin: 0; }

.mlw ol.steps { counter-reset: s; list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
@media (max-width: 760px) { .mlw ol.steps { grid-template-columns: 1fr; } }
.mlw ol.steps li { counter-increment: s; background: var(--panel); border: 3px solid var(--ink); padding: 16px 16px 14px; font-size: 14px; margin: 0; }
.mlw ol.steps li::before { content: counter(s); font-family: "Silkscreen", monospace; font-size: 28px; display: block; line-height: 1; margin-bottom: 8px; color: var(--green); }
.mlw .after { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.mlw .faq details { border-bottom: 2px dashed var(--dim); padding: 10px 0; }
.mlw .faq summary { cursor: pointer; font-weight: 600; list-style: none; }
.mlw .faq summary::-webkit-details-marker { display: none; }
.mlw .faq summary::before { content: "▸ "; font-family: "Silkscreen", monospace; }
.mlw .faq details[open] summary::before { content: "▾ "; }
.mlw .faq p { margin: 8px 0 4px 18px; font-size: 14px; }
.mlw .foot { margin-top: 34px; font-size: 12.5px; color: var(--dim); border-top: 3px solid var(--ink); padding-top: 12px; }
.mlw .foot a { color: var(--dim); }
.mlw .video { position: relative; aspect-ratio: 16 / 9; border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--shadow); background: #000; max-width: 820px; }
.mlw .video { display: block; }
.mlw .video img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.mlw .video .play { position: absolute; left: 50%; top: 50%; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%;
       background: rgba(39, 50, 58, .86); color: #f0e8d6; font-size: 34px; line-height: 84px; text-align: center; text-indent: 6px; }
.mlw a.video:hover .play { background: #9c5a3c; }
</style>
